<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Sari POS</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-card__logo">
      <h1><i data-lucide="store"></i> Sari POS</h1>
      <p>Sari-Sari Store Point of Sale</p>
    </div>
    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div style="position:relative;">
          <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" style="padding-right:42px;" />
          <button type="button" id="toggle-pw" tabindex="-1" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--gray-400);padding:0;display:flex;align-items:center;">
            <i data-lucide="eye" id="pw-icon" style="width:18px;height:18px;"></i>
          </button>
        </div>
      </div>
      <div id="error-alert" class="alert alert--error" style="display:none;margin-bottom:12px;"></div>
      <button type="submit" class="btn btn--primary" style="width:100%;" id="login-btn">Sign In</button>
    </form>
  </div>
</div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="/js/api.js"></script>
<script>
  lucide.createIcons();
  if (getUser() && getToken()) window.location.href = '/dashboard.html';

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const errEl = document.getElementById('error-alert');
    btn.disabled = true;
    btn.textContent = 'Signing in...';
    errEl.style.display = 'none';

    try {
      const data = await apiFetch('/auth/login', {
        method: 'POST',
        body: { email: document.getElementById('email').value, password: document.getElementById('password').value },
      });
      setSession(data.access_token, data.refresh_token, data.user);
      window.location.href = '/dashboard.html';
    } catch (err) {
      errEl.textContent = err.message || 'Invalid email or password';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign In';
      document.getElementById('password').select();
    }
  });

  // Toggle password visibility
  document.getElementById('toggle-pw').addEventListener('click', () => {
    const pw = document.getElementById('password');
    const icon = document.getElementById('pw-icon');
    if (pw.type === 'password') {
      pw.type = 'text';
      icon.setAttribute('data-lucide', 'eye-off');
    } else {
      pw.type = 'password';
      icon.setAttribute('data-lucide', 'eye');
    }
    lucide.createIcons();
  });

  // Allow Enter key on inputs
  document.getElementById('email').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('password').focus();
  });
</script>
</body>
</html>
